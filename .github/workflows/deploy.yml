name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Bundle Partsong ONNX models into site artifact
        run: |
          mkdir -p dist/models
          curl -fSL "https://partsong.app/models/segnet_308-3296ccd40960f90ca6ab9c035cca945675d30a0f.onnx" -o "dist/models/segnet_308-3296ccd40960f90ca6ab9c035cca945675d30a0f.onnx" &
          curl -fSL "https://partsong.app/models/encoder_pytorch_model_465-597144cab54c8f6d0f6c9619df5c5312694eadd6.onnx" -o "dist/models/encoder_pytorch_model_465-597144cab54c8f6d0f6c9619df5c5312694eadd6.onnx" &
          curl -fSL "https://partsong.app/models/decoder_pytorch_model_465-597144cab54c8f6d0f6c9619df5c5312694eadd6.onnx" -o "dist/models/decoder_pytorch_model_465-597144cab54c8f6d0f6c9619df5c5312694eadd6.onnx" &
          wait
          ls -lh dist/models

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
